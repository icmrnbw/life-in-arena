[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="locale/*.json"
exclude_filter="tests/*, qa/*, tools/*, build/*, android/*, *.md, locale/keys.json, locale/todo_*.json"
export_path="build/emberpit-debug.apk"

[preset.0.options]

launcher_icons/main_192x192="res://art/app_icon.png"
launcher_icons/adaptive_foreground_432x432="res://art/app_icon_fg.png"
launcher_icons/adaptive_background_432x432="res://art/app_icon_bg.png"

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.emberpit.game"
package/name="Emberpit"
package/signed=true
screen/immersive_mode=true
user_data_backup/allow=true
permissions/vibrate=true
version/code=36
version/name="0.9.1"

